name: Mission Control checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build
      - run: npm run format:check

  continuous-missions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './backend[dev]'
      - run: npm --prefix frontend ci --no-fund --no-audit
      - name: Continuous UI and real backend acceptance (injected model only)
        shell: pwsh
        run: |
          $env:AGENTOS_TEST_PYTHON = (Get-Command python).Source
          npm --prefix frontend run test:integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
