name: Backend checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Test
        run: python -m pytest backend/tests
      - name: Lint
        run: python -m ruff check backend
      - name: Format
        run: python -m ruff format --check backend
      - name: Type check
        run: python -m mypy --config-file backend/pyproject.toml backend/src
